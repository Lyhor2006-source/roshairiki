name: Build iOS Dylib (Mac Cloud)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ios:
    name: Build RyomenX iOS arm64
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Selecting Xcode on macOS runner..."
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Toolchain Dependencies
        run: |
          brew install cmake ldid ninja

      - name: Detect Source Directory
        id: detect
        run: |
          if [ -d "RyomenX_Source" ]; then
            echo "src_dir=RyomenX_Source" >> "$GITHUB_OUTPUT"
          else
            echo "src_dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Configure CMake for iOS (arm64)
        run: |
          SRC_DIR="${{ steps.detect.outputs.src_dir }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"
          echo "Configuring CMake for iOS from ${SRC_DIR} in ${BUILD_TYPE} mode..."

          cmake -B build -S "$SRC_DIR" \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

      - name: Compile RyomenX.dylib with Xcode
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"
          cmake --build build --config "$BUILD_TYPE" -- -quiet

      - name: Locate & Pseudo-Sign Dylib
        run: |
          mkdir -p dist
          DYLIB_FILE=$(find build -name "RyomenX.dylib" -type f | head -n 1)

          if [ -z "$DYLIB_FILE" ]; then
            echo "::error::RyomenX.dylib was not produced by the build!"
            exit 1
          fi

          echo "Found compiled dylib: $DYLIB_FILE"
          cp "$DYLIB_FILE" dist/RyomenX.dylib
          cp "$DYLIB_FILE" dist/RyomenX-iOS-arm64.dylib

          # Ad-hoc code signing & ldid fake sign for iOS sandbox compatibility
          codesign --force --deep --sign - dist/RyomenX.dylib
          ldid -S dist/RyomenX.dylib
          codesign --force --deep --sign - dist/RyomenX-iOS-arm64.dylib
          ldid -S dist/RyomenX-iOS-arm64.dylib

          # Verify Mach-O headers and architecture
          file dist/RyomenX.dylib
          otool -L dist/RyomenX.dylib

      - name: Generate Build Summary
        run: |
          SHA256=$(shasum -a 256 dist/RyomenX.dylib | awk '{print $1}')
          FILESIZE=$(ls -lh dist/RyomenX.dylib | awk '{print $5}')
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # 🚀 RyomenX VIP iOS Dylib Build Complete

          | Property | Value |
          |---|---|
          | **Target Architecture** | \`arm64\` (iOS 14.0+) |
          | **iOS SDK Version** | \`iphoneos ${SDK_VER}\` |
          | **UI Engine** | Metal + Dear ImGui (Eclipse Modern White) |
          | **Cheats Integrated** | 20 Darwin Mach VM Features + BigWorld Python ESP |
          | **File Size** | \`${FILESIZE}\` |
          | **SHA-256** | \`${SHA256}\` |
          | **Code Signing** | Ad-hoc + ldid Fake-Signed (\`ready for sideload\`) |

          ### 📱 Sideloading Instructions:
          1. Download **\`RyomenX-iOS-arm64-dylib\`** from the Artifacts below.
          2. Inject into Rules of Survival IPA using **Azule**, **Sideloadly**, **Esign**, or **Scarlet**:
             \`\`\`bash
             azule -i RulesOfSurvival.ipa -o ROS_Modded.ipa -f RyomenX.dylib
             \`\`\`
          3. Install via **TrollStore** (Jailbroken/Rootless/TrollStore) or **Scarlet/Sideloadly** (Non-Jailbroken).
          EOF

      - name: Upload Dylib Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RyomenX-iOS-arm64-dylib
          path: dist/
          retention-days: 14
