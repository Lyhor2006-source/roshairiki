name: Build RyomenX iOS Cheat Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-theos:
    name: Build RyomenX iOS arm64 Dylib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Download ImGui & Official iOS SDKs
        run: |
          echo "[*] Ensuring iOS SDK is loaded into Theos..."
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          sudo cp -r /tmp/sdks/*.sdk "$THEOS/sdks/" || true
          ls -la "$THEOS/sdks/"

          # Detect source folder
          if [ -d "RyomenX_Source" ]; then
            cd RyomenX_Source
          fi

          echo "[*] Downloading Dear ImGui v1.90.4..."
          git clone --depth 1 --branch v1.90.4 https://github.com/ocornut/imgui.git imgui

      - name: Compile RyomenX.dylib with Theos
        run: |
          if [ -d "RyomenX_Source" ]; then
            cd RyomenX_Source
          fi
          echo "[*] Compiling RyomenX.dylib with Theos..."
          make 2>&1 | tee theos_build.log || {
            echo "### ❌ Theos Build Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat theos_build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Locate & Verify Dylib
        run: |
          mkdir -p output
          DYLIB=$(find . -name "RyomenX.dylib" -type f | grep -E "(\.theos|obj)" | head -n 1)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find . -name "RyomenX.dylib" -type f | head -n 1)
          fi

          if [ -z "$DYLIB" ]; then
            echo "::error::RyomenX.dylib was not created!"
            find . -type f -name "*dylib*"
            exit 1
          fi

          echo "Found compiled dylib: $DYLIB"
          cp "$DYLIB" output/RyomenX.dylib
          ls -lh output/RyomenX.dylib
          file output/RyomenX.dylib

      - name: Generate Summary
        run: |
          SHA256=$(sha256sum output/RyomenX.dylib | awk '{print $1}')
          FILESIZE=$(ls -lh output/RyomenX.dylib | awk '{print $5}')
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # 🚀 RyomenX VIP iOS Dylib Build Complete

          | Property | Value |
          |---|---|
          | **Architecture** | \`arm64\` (iOS 14.0+) |
          | **Engine** | Eclipse White ImGui + Native Metal Overlay |
          | **Features** | 20 Darwin Mach VM Cheats + BigWorld Python ESP |
          | **File Size** | \`${FILESIZE}\` |
          | **SHA256** | \`${SHA256}\` |
          | **Status** | Ready for Sideloading |

          ### 📲 Sideloading Instructions:
          Download **\`RyomenX-iOS-arm64-dylib\`** from the Artifacts below and inject into Rules of Survival IPA with **Azule**, **Sideloadly**, or **Esign**.
          EOF

      - name: Upload RyomenX.dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyomenX-iOS-arm64-dylib
          path: output/RyomenX.dylib
          retention-days: 14
